<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>AKX YouTube</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- Reproductor para la pantalla de reuniones de FlyNetwork (akx-resource). Se publica en GitHub
       Pages: desde una página https real YouTube acepta el video insertado (sin error 153).
       Uso: index.html?v=ID&t=segundos. Mensajes del juego (SendDuiMessage): { volume, fade, skip }. -->
  <div id="player"></div>
  <script>
    const q = new URLSearchParams(location.search);
    const id = (q.get('v') || '').replace(/[^\w-]/g, '').slice(0, 11);
    const start = Math.max(0, parseInt(q.get('t') || '0', 10) || 0);
    let volume = Math.max(0, Math.min(100, parseInt(q.get('vol') || '60', 10)));
    let fade = 1;
    let player = null;

    function apply() {
      if (!player || !player.setVolume) return;
      const v = Math.round(volume * fade);
      if (v <= 0) player.mute(); else { player.unMute(); player.setVolume(v); }
    }

    window.onYouTubeIframeAPIReady = () => {
      if (!id) return;
      player = new YT.Player('player', {
        videoId: id,
        playerVars: { autoplay: 1, controls: 0, rel: 0, loop: 1, playlist: id, playsinline: 1, start, modestbranding: 1, iv_load_policy: 3 },
        events: {
          onReady: (e) => { apply(); e.target.playVideo(); },
          // Si el navegador bloquea el inicio con sonido, arranca y vuelve a aplicar el volumen.
          onStateChange: (e) => { if (e.data === YT.PlayerState.PLAYING) apply(); },
        },
      });
    };

    window.addEventListener('message', (e) => {
      let d = e.data;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
      if (!d || typeof d !== 'object' || d.event) return;   // mensajes propios del reproductor
      if (typeof d.volume === 'number') volume = Math.max(0, Math.min(100, d.volume));
      if (typeof d.fade === 'number') fade = Math.max(0, Math.min(1, d.fade));
      apply();
    });

    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  </script>
</body>
</html>
